[package]
name = "vaulty-sdk"
description = "The C ABI every Vaulte SDK and app is built on"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/vaulte-labs/sdk-c"
homepage = "https://vaulte.caeser.workers.dev"

[lib]
name = "vaulty"
crate-type = ["staticlib", "rlib"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[features]
# Lets end-to-end tests stand in for a person. Never enabled in a release.
test-hooks = ["libvault/test-hooks"]

[dependencies]
base64 = "0.22"
libvault = { path = "../libvault", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# iOS starts no other process, so the broker runs inside the app.
[target.'cfg(target_os = "ios")'.dependencies]
libvault = { path = "../libvault", default-features = false, features = ["broker"] }
